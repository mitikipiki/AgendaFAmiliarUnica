<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Familiar</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background-image:url('mi perrita entrada.png');
    background-size:cover;
    background-position:center;
    min-height:100vh;
}

#contenido-agenda{
    display:none;
}

header{
    background:rgba(0,0,0,0.4);
    color:white;
    padding:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

.boton-cerrar{
    position:absolute;
    right:10px;
    width:35px;
    height:35px;
    border-radius:50%;
    border:none;
    cursor:pointer;
}

#agenda{
    max-width:600px;
    margin:auto;
    padding:10px;
}

.evento-card{
    background:rgba(255,255,255,0.7);
    margin:10px 0;
    padding:10px;
    border-radius:10px;
}
</style>
</head>

<body>

<div id="contenido-agenda">

<header>
<h1>Agenda Familiar</h1>
<button class="boton-cerrar" onclick="cerrarPagina()">X</button>
</header>

<div id="agenda">Cargando...</div>

</div>

<script>

const SHEET_ID='1TPhi8Z5oKh3NMu_0n1VetSFI5oA0MSbkhca9EG3wy0k';
const URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

const CONTRASEÑA_CORRECTA="miperritalucia";

let agendaAbierta = true;
let bloqueado = false;

function cerrarPagina(){
    document.getElementById('contenido-agenda').style.display='none';
    agendaAbierta = false;
    history.pushState({}, "");
}

window.addEventListener("popstate", function () {

    if (!agendaAbierta && !bloqueado) {

        document.body.innerHTML = `
            <div style="
                height:100vh;
                display:flex;
                flex-direction:column;
                justify-content:center;
                align-items:center;
                text-align:center;
                background:rgba(0,0,0,0.7);
                color:white;
                font-size:22px;
                padding:20px;
            ">
                <p><strong>Agenda cerrada</strong></p>
                <button id="btnOk" style="
                    margin-top:20px;
                    padding:10px 20px;
                    font-size:18px;
                    border:none;
                    border-radius:8px;
                ">
                    Aceptar
                </button>
            </div>
        `;

        document.getElementById("btnOk").onclick = function(){
            bloqueado = true;

            document.body.innerHTML = `
                <div style="
                    height:100vh;
                    display:flex;
                    justify-content:center;
                    align-items:center;
                    color:white;
                    background:rgba(0,0,0,0.6);
                    font-size:22px;
                ">
                    Agenda cerrada
                </div>
            `;
        };
    }
});

function comprobarAcceso(){

    const intento=prompt("Introduce la contraseña:");

    if(intento===CONTRASEÑA_CORRECTA){
        document.getElementById('contenido-agenda').style.display='block';
        cargarAgenda();
    }else{
        alert("Incorrecta");
        comprobarAcceso();
    }
}

async function cargarAgenda(){

    const response=await fetch(URL);
    const text=await response.text();
    const data=JSON.parse(text.substr(47).slice(0,-2));

    const filas=data.table.rows;
    const contenedor=document.getElementById('agenda');

    contenedor.innerHTML='';

    filas.slice(1).forEach((fila)=>{

        if(!fila.c || !fila.c[0]) return;

        const fecha=fila.c[0].v || '';
        const titulo=fila.c[1]?.v || '';
        const desc=fila.c[2]?.v || '';
        const cat=fila.c[3]?.v || '';

        const card=document.createElement('div');
        card.className='evento-card';

        card.innerHTML=`
            <strong>${fecha}</strong><br>
            ${titulo}<br>
            ${desc}<br>
            <em>${cat}</em>
        `;

        contenedor.appendChild(card);
    });
}

comprobarAcceso();

</script>

</body>
</html>
