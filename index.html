<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Familiar</title>

<style>
:root {
    --primary: #1c3d5a;
    --accent: #e74c3c;
    --bg: #dbf0f9;
    --text: #000000;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background-image:url('mi perrita entrada.png');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
    min-height:100vh;
    color:var(--text);
    padding:15px;
}

#contenido-agenda{
    display:none;
    position: relative;
    z-index: 2;
}

header{
    background-color:rgba(140,150,155,0.45);
    color:var(--primary);
    padding:15px;
    text-align:center;
    border-radius:10px;
    margin-bottom:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

h1{
    font-size:24px;
    display:flex;
    align-items:center;
}

.icono-titulo{
    width:45px;
    height:45px;
    border-radius:50%;
    margin-right:12px;
}

.boton-cerrar{
    position:absolute;
    right:15px;
    width:35px;
    height:35px;
    border-radius:50%;
    border:none;
    cursor:pointer;
}

#btn-salir{
    display:none;
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    padding:10px 20px;
    border:none;
    border-radius:10px;
    background:#000;
    color:white;
    font-size:16px;
    z-index:9999;
}

#fecha-hoy{
    text-align:center;
    color:red;
    font-weight:bold;
    margin-top:5px;
    font-size:16px;
}

/* CALENDARIO */
#calendario-mes{
    margin: 10px auto 20px;
    max-width: 320px;
    background: rgba(255,255,255,0.75);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    font-size: 14px;
}

.cal-header{
    font-weight: bold;
    margin-bottom: 8px;
    color: #1c3d5a;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
}

.cal-header button{
    background:#e74c3c;
    color:white;
    border:none;
    border-radius:6px;
    padding:4px 8px;
    cursor:pointer;
}

.cal-grid{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    font-size: 12px;
}

.today{
    background:#e74c3c;
    color:white;
    font-weight:bold;
}

#agenda{
    max-width:600px;
    margin:0 auto;
}

.loading{
    text-align:center;
    padding:15px;
    background:rgba(255,255,255,0.7);
    border-radius:10px;
}

.evento-card{
    background:rgba(255,255,255,0.65);
    margin-bottom:15px;
    padding:15px;
    border-radius:10px;
}

.evento-header{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
}

.fecha{
    font-weight:bold;
}

.titulo{
    font-size:20px;
    color:#e74c3c;
    font-weight:bold;
}

.descripcion{
    font-weight:bold;
}
</style>
</head>

<body>

<div id="contenido-agenda">

<header>

<div>
    <h1>
        <img src="Lucia.bmp" class="icono-titulo">
        Agenda Familiar
    </h1>

    <div id="fecha-hoy"></div>
    <div id="calendario-mes"></div>
</div>

<button class="boton-cerrar" onclick="cerrarPagina()">X</button>

</header>

<main id="agenda">
<div class="loading">Cargando eventos...</div>
</main>

</div>

<button id="btn-salir" onclick="salirApp()">🚪 Cerrar agenda</button>

<script>

const SHEET_ID='1TPhi8Z5oKh3NMu_0n1VetSFI5oA0MSbkhca9EG3wy0k';
const URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

const CONTRASEÑA_CORRECTA="miperritalucia";

/* CERRAR APP */
function salirApp(){

    document.body.innerHTML = `
        <div style="
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            background-image:url('mi perrita entrada.png');
            background-size:cover;
            text-align:center;
            padding:20px;
        ">
            <h2 style="color:black;">Agenda cerrada</h2>
            <p style="color:black; font-size:18px; margin-top:10px;">
                Pulsa la flecha de atrás del móvil para volver a la pantalla inicial
            </p>
        </div>
    `;
}

</script>

</body>
</html>
