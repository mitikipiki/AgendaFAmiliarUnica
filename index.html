
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Familiar</title>

<style>
:root {
    --primary: #1c3d5a;
    --accent: #e74c3c;
    --bg: #dbf0f9;
    --text: #000000;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background-image:url('mi perrita entrada.png');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
    min-height:100vh;
    color:var(--text);
    padding:15px;
}

/* AGENDA */
#contenido-agenda{
    display:none;
    position: relative;
    z-index: 2;
}

/* HEADER */
header{
    background-color:rgba(140,150,155,0.45);
    color:var(--primary);
    padding:15px;
    text-align:center;
    border-radius:10px;
    margin-bottom:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

h1{
    font-size:24px;
    display:flex;
    align-items:center;
}

.icono-titulo{
    width:45px;
    height:45px;
    border-radius:50%;
    margin-right:12px;
}

/* BOTÓN X */
.boton-cerrar{
    position:absolute;
    right:15px;
    width:35px;
    height:35px;
    border-radius:50%;
    border:none;
    cursor:pointer;
}

/* BOTÓN REABRIR */
#btn-reabrir{
    display:none;
    position:fixed;
    bottom:20px;
    right:20px;
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background:#1c3d5a;
    color:white;
    font-size:14px;
    z-index:9999;
}

/* BOTÓN SALIR TOTAL */
#btn-salir{
    display:none;
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    padding:10px 20px;
    border:none;
    border-radius:10px;
    background:#000;
    color:white;
    font-size:16px;
    z-index:9999;
}

/* FECHA */
#fecha-hoy{
    text-align:center;
    color:red;
    font-weight:bold;
    margin-top:5px;
    font-size:16px;
}

/* CALENDARIO */
#calendario-mes{
    margin: 10px auto 20px;
    max-width: 320px;
    background: rgba(255,255,255,0.75);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    font-size: 14px;
}

.cal-header{
    font-weight: bold;
    margin-bottom: 8px;
    color: #1c3d5a;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
}

.cal-header button{
    background:#e74c3c;
    color:white;
    border:none;
    border-radius:6px;
    padding:4px 8px;
    cursor:pointer;
}

.cal-grid{
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    font-size: 12px;
}

.cal-day{
    padding: 4px;
    border-radius: 4px;
}

.today{
    background:#e74c3c;
    color:white;
    font-weight:bold;
}

/* AGENDA */
#agenda{
    max-width:600px;
    margin:0 auto;
}

.loading{
    text-align:center;
    padding:15px;
    background:rgba(255,255,255,0.7);
    border-radius:10px;
}

.evento-card{
    background:rgba(255,255,255,0.65);
    margin-bottom:15px;
    padding:15px;
    border-radius:10px;
}

.evento-header{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
}

.fecha{
    font-weight:bold;
}

.titulo{
    font-size:20px;
    color:#e74c3c;
    font-weight:bold;
}

.descripcion{
    font-weight:bold;
}
</style>
</head>

<body>

<div id="contenido-agenda">

<header>

<div>
    <h1>
        <img src="Lucia.bmp" class="icono-titulo">
        Agenda Familiar
    </h1>

    <div id="fecha-hoy"></div>
    <div id="calendario-mes"></div>
</div>

<button class="boton-cerrar" onclick="cerrarPagina()">X</button>

</header>

<main id="agenda">
<div class="loading">Cargando eventos...</div>
</main>

</div>

<!-- BOTONES -->
<button id="btn-reabrir" onclick="comprobarAcceso()">📂 Abrir agenda</button>
<button id="btn-salir" onclick="salirApp()">🚪 Cerrar agenda</button>

<script>

const SHEET_ID='1TPhi8Z5oKh3NMu_0n1VetSFI5oA0MSbkhca9EG3wy0k';
const URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

const CONTRASEÑA_CORRECTA="lucia";

let mesActual = new Date().getMonth();
let añoActual = new Date().getFullYear();

/* ENTRAR */
function comprobarAcceso(){

    const intento=prompt("Introduce la contraseña:");

    if(intento===CONTRASEÑA_CORRECTA){

        document.getElementById('contenido-agenda').style.display='block';

        document.getElementById('btn-reabrir').style.display='none';
        document.getElementById('btn-salir').style.display='none';

        const hoyTexto = new Date().toLocaleDateString('es-ES', {
            weekday: 'long',
            day: 'numeric',
            month: 'long'
        });

        document.getElementById('fecha-hoy').textContent =
            'Hoy es: ' + hoyTexto;

        generarCalendario();
        cargarAgenda();

    }else{
        alert("Contraseña incorrecta.");
        comprobarAcceso();
    }
}

/* X */
function cerrarPagina(){

    document.getElementById('contenido-agenda').style.display='none';

    document.getElementById('btn-reabrir').style.display='block';
    document.getElementById('btn-salir').style.display='block';
}

/* SALIR TOTAL */
function salirApp(){

    document.body.innerHTML = `
        <div style="
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            background-image:url('mi perrita entrada.png');
            background-size:cover;
            color:black;
            text-align:center;
        ">
            <h2>Agenda cerrada</h2>
            <p> Pulsa la flecha de atrás del móvil para volver a la pantalla inicial</p>
        </div>
    `;
}

/* CALENDARIO */
function generarCalendario(){

    const cont = document.getElementById("calendario-mes");

    const primerDia = new Date(añoActual, mesActual, 1);
    const ultimoDia = new Date(añoActual, mesActual + 1, 0);
    const hoy = new Date();

    const diasSemana = ["L","M","X","J","V","S","D"];

    let html = `
        <div class="cal-header">
            <button onclick="cambiarMes(-1)">⬅</button>
            ${primerDia.toLocaleDateString('es-ES',{month:'long',year:'numeric'})}
            <button onclick="cambiarMes(1)">➡</button>
        </div>
        <div class="cal-grid">
    `;

    diasSemana.forEach(d=>{
        html+=`<div><strong>${d}</strong></div>`;
    });

    for(let i=0;i<primerDia.getDay();i++){
        html+=`<div></div>`;
    }

    for(let d=1;d<=ultimoDia.getDate();d++){

        const esHoy =
            d===hoy.getDate() &&
            mesActual===hoy.getMonth() &&
            añoActual===hoy.getFullYear();

        html+=`<div class="${esHoy?'today':''}">${d}</div>`;
    }

    html+=`</div>`;
    cont.innerHTML=html;
}

/* CAMBIO MES */
function cambiarMes(dir){

    mesActual+=dir;

    if(mesActual>11){
        mesActual=0;
        añoActual++;
    }

    if(mesActual<0){
        mesActual=11;
        añoActual--;
    }

    generarCalendario();
}

/* AGENDA */
async function cargarAgenda(){

    try{

        const response=await fetch(URL);
        const text=await response.text();
        const data=JSON.parse(text.substr(47).slice(0,-2));

        const filas=data.table.rows;
        const contenedor=document.getElementById('agenda');

        contenedor.innerHTML='';

        const hoy=new Date();
        hoy.setHours(0,0,0,0);

        filas.slice(1).forEach((fila)=>{

            if(!fila.c || !fila.c[0]) return;

            const fechaTexto = fila.c[0].f || fila.c[0].v || '';
            const titulo = fila.c[1]?.v || '';
            const descripcion = fila.c[2]?.v || '';
            const categoria = fila.c[3]?.v || '';

            const partes=fechaTexto.split('/');
            if(partes.length!==3) return;

            const fechaEvento=new Date(
                parseInt(partes[2]),
                parseInt(partes[1])-1,
                parseInt(partes[0])
            );

            fechaEvento.setHours(0,0,0,0);

            const fechaInicio=new Date(fechaEvento);
            fechaInicio.setDate(fechaEvento.getDate()-3);

            if(hoy>=fechaInicio && hoy<=fechaEvento){

                const card=document.createElement('div');
                card.className='evento-card';

                card.innerHTML=`
                    <div class="evento-header">
                        <span class="fecha">${fechaTexto}</span>
                        <span><strong>${categoria}</strong></span>
                    </div>
                    <div class="titulo">${titulo}</div>
                    <div class="descripcion">${descripcion}</div>
                `;

                contenedor.appendChild(card);
            }

        });

        if(contenedor.innerHTML===''){
            contenedor.innerHTML='<div class="loading">No hay eventos.</div>';
        }

    }catch(error){
        document.getElementById('agenda').innerHTML='<div class="loading">Error cargando datos.</div>';
    }
}

comprobarAcceso();

</script>

</body>
</html>
